version: "3.9"

services:

  # ======================================
  # Minio (S3 para testes com spark)
  # ======================================

  #minio:
  #  #image: minio/minio:RELEASE.2025-04-22T22-12-26Z
  #  #image: minio/minio:RELEASE.2025-05-24T17-08-30Z-cpuv1
  #  image: minio/minio:latest
